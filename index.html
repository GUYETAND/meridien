<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Orinergie a changé d'adresse</title>
    <link rel="canonical" href="https://orinergie.vercel.app/" />
    <!-- Garde l'écran demandé (#/corps, #/cas…) ; sans JavaScript, le meta refresh prend le relais. -->
    <script>
      location.replace('https://orinergie.vercel.app/' + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://orinergie.vercel.app/" />
  </head>
  <body>
    <p>
      Orinergie est désormais à l'adresse
      <a href="https://orinergie.vercel.app/">orinergie.vercel.app</a>.
    </p>
  </body>
</html>
